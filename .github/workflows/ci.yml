name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    # Runs on both pull_request and push so squash-merges only re-run
    # what the squashed commit actually touched (paths-filter uses
    # github.event.before on push).
    permissions:
      contents: read
      pull-requests: write
    outputs:
      mobile: ${{ steps.resolve.outputs.mobile }}
      rust_projects: ${{ steps.resolve.outputs.rust_projects }}
      crypto: ${{ steps.filter.outputs.crypto }}
    steps:
      - uses: actions/checkout@v4

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # .github/workflows/ci.yml is intentionally NOT in any project
          # filter — a workflow-only edit is handled via ci_self below
          # (cheap smoke: dev-setup + mobile), not a full fan-out.
          filters: |
            api:
              - 'apps/api/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.moon/**'
            quic-relay-client:
              - 'packages/quic-relay-client/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.moon/**'
            dev-setup:
              - 'packages/dev-setup/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.moon/**'
            mobile:
              - 'apps/mobile/**'
              - '.moon/**'
            ci_self:
              - '.github/workflows/ci.yml'
            crypto:
              - 'apps/api/src/crypto/**'
              - 'apps/api/src/auth/**'
              - 'apps/mobile/src/crypto/**'

      - name: Resolve matrix + mobile
        id: resolve
        env:
          API: ${{ steps.filter.outputs.api }}
          QUIC: ${{ steps.filter.outputs.quic-relay-client }}
          DEV_SETUP: ${{ steps.filter.outputs.dev-setup }}
          MOBILE: ${{ steps.filter.outputs.mobile }}
          CI_SELF: ${{ steps.filter.outputs.ci_self }}
        run: |
          projects='[]'
          mobile="$MOBILE"

          if [ "$API" = "true" ]; then
            projects=$(echo "$projects" | jq -c '. + ["api"]')
          fi
          if [ "$QUIC" = "true" ]; then
            projects=$(echo "$projects" | jq -c '. + ["quic-relay-client"]')
          fi
          if [ "$DEV_SETUP" = "true" ]; then
            projects=$(echo "$projects" | jq -c '. + ["dev-setup"]')
          fi

          # Workflow-only edit: smoke the cheapest Rust leg + mobile so
          # the shared matrix setup stays validated without burning api.
          if [ "$CI_SELF" = "true" ] && [ "$projects" = "[]" ] && [ "$mobile" != "true" ]; then
            projects='["dev-setup"]'
            mobile=true
          fi

          echo "rust_projects=$projects" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "Resolved rust_projects=$projects mobile=$mobile"

      - name: Crypto-review notice
        if: >-
          github.event_name == 'pull_request' &&
          steps.filter.outputs.crypto == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER="<!-- crypto-review-notice -->"
          if gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq '.[].body' \
              | grep -qF "$MARKER"; then
            echo "Notice already posted, skipping."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$MARKER
          This PR touches \`apps/api/src/crypto/**\`, \`apps/api/src/auth/**\`, or \`apps/mobile/src/crypto/**\`. Per [AGENTS.md](../blob/main/AGENTS.md), \`merge-gate\` must not merge without \`crypto-reviewer\` sign-off (run the \`pqc-crypto-change\` checklist first)."

  rust:
    name: rust (${{ matrix.project }})
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.rust_projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.rust_projects) }}
    env:
      DATABASE_URL: postgres://epistl:epistl@localhost:5432/epistl
      AUTH_SECRET: ci-only-secret-do-not-use-in-prod-32+
      NATS_URL: nats://localhost:4222
      SEAWEEDFS_S3_ACCESS_KEY: epistl
      SEAWEEDFS_S3_SECRET_KEY: epistl-seaweedfs-dev-secret
      SEAWEEDFS_INTERNAL_ENDPOINT: http://localhost:8333
      SEAWEEDFS_PUBLIC_ENDPOINT: http://localhost:8333
      AVATAR_BUCKET_NAME: avatars
      # Root .cargo/config.toml sets rustc-wrapper = sccache for the whole
      # workspace. SCCACHE_DIR pins the on-disk cache so actions/cache
      # can target it; each matrix leg has its own key (see Restore sccache).
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - uses: actions/checkout@v4
        with:
          # moon needs full history to resolve a merge base with main.
          fetch-depth: 0
          filter: blob:none

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install sccache
        env:
          SCCACHE_VERSION: "0.18.0"
        run: |
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /tmp
          sudo mv "/tmp/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache" /usr/local/bin/sccache
          sccache --version

      # api tests run through nextest (#254). Installed on every rust leg
      # (a few seconds) so a workflow-only edit's dev-setup smoke run also
      # validates the install.
      - name: Install cargo-nextest
        env:
          NEXTEST_VERSION: "0.9.145"
        run: |
          curl -fsSL "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin"
          cargo nextest --version

      # actions/cache entries are immutable: with a key that only hashes
      # Cargo.lock, the first run for a given lockfile saved a near-empty
      # cache and every later run restored that same ~1 MB entry, rebuilt
      # everything, and refused to save ("Cache hit occurred on the primary
      # key"). So: restore the newest entry via the restore-keys prefixes,
      # and save a fresh one (unique per commit) only from main. PR runs
      # can read main's caches but never write, so PRs don't churn the
      # 10 GB quota.
      - name: Restore sccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-rust-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            sccache-rust-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('Cargo.lock') }}-
            sccache-rust-${{ runner.os }}-${{ matrix.project }}-

      # Registry + git only — no target/. Compilation units live in
      # sccache; caching target/ was the 2 GB thrash that blew the
      # 10 GB Actions cache quota.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Install moon
        uses: moonrepo/setup-toolchain@v0

      - name: Install shellcheck
        if: matrix.project == 'dev-setup'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # Postgres / NATS / SeaweedFS only for the api leg. Conditional
      # docker run (not services:) so non-api matrix legs skip them.
      - name: Start Postgres
        if: matrix.project == 'api'
        run: |
          docker run -d --name postgres \
            -e POSTGRES_USER=epistl \
            -e POSTGRES_PASSWORD=epistl \
            -e POSTGRES_DB=epistl \
            -p 5432:5432 \
            postgres:16
          timeout 30s sh -c \
            'until docker exec postgres pg_isready -U epistl -d epistl >/dev/null 2>&1; do sleep 1; done'

      - name: Start NATS (JetStream)
        if: matrix.project == 'api'
        run: |
          docker run -d --name nats \
            -p 4222:4222 -p 8222:8222 \
            nats:2-alpine -js -sd /data -m 8222
          timeout 30s sh -c \
            'until wget -qO- http://localhost:8222/healthz >/dev/null 2>&1; do sleep 1; done'

      - name: Start SeaweedFS
        if: matrix.project == 'api'
        run: |
          docker run -d --name seaweedfs \
            -p 8333:8333 -p 9333:9333 \
            -v "$(pwd)/docker/seaweedfs-s3-config.json:/etc/seaweedfs/s3.json:ro" \
            -e S3_BUCKET=avatars \
            chrislusf/seaweedfs:4.47 mini -dir=/data -s3.config=/etc/seaweedfs/s3.json
          timeout 30s sh -c \
            'until curl -fs http://localhost:9333/cluster/status >/dev/null 2>&1; do sleep 1; done'

      - name: Format
        run: moon run ${{ matrix.project }}:check

      - name: Clippy
        run: moon run ${{ matrix.project }}:lint

      - name: Test
        run: moon run ${{ matrix.project }}:test

      - name: Shellcheck bootstrap.sh
        if: matrix.project == 'dev-setup'
        run: moon run dev-setup:bootstrap-lint

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Save sccache
        if: >-
          !cancelled() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-rust-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}

  mobile:
    name: mobile
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install moon
        uses: moonrepo/setup-toolchain@v0

      - name: Lint
        run: moon run mobile:lint

      - name: Typecheck
        run: moon run mobile:typecheck

      - name: Test
        run: moon run mobile:test

  # Single required status check for branch protection. Path-filtered
  # jobs (rust / mobile) may be skipped; this job always runs and fails
  # only if a needed job failed (skipped is OK).
  ci:
    name: ci
    if: always()
    needs: [changes, rust, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        run: |
          set -e
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes failed: ${{ needs.changes.result }}"
            exit 1
          fi
          if [ "${{ needs.rust.result }}" != "success" ] && [ "${{ needs.rust.result }}" != "skipped" ]; then
            echo "rust failed: ${{ needs.rust.result }}"
            exit 1
          fi
          if [ "${{ needs.mobile.result }}" != "success" ] && [ "${{ needs.mobile.result }}" != "skipped" ]; then
            echo "mobile failed: ${{ needs.mobile.result }}"
            exit 1
          fi
          echo "All required jobs passed or were correctly skipped."
