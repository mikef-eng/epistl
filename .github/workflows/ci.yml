name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: epistl
          POSTGRES_PASSWORD: epistl
          POSTGRES_DB: epistl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epistl -d epistl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://epistl:epistl@localhost:5432/epistl
      # Not a real secret -- only used against the ephemeral CI Postgres
      # service. `better-auth` requires at least 32 bytes.
      AUTH_SECRET: ci-only-secret-do-not-use-in-prod-32+
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api -> ../../target

      - name: Install moon
        uses: moonrepo/setup-toolchain@v0

      - name: Format
        run: moon run api:check

      - name: Clippy
        run: moon run api:lint

      # api:test depends on api:migrate (see apps/api/moon.yml), so
      # migrations run automatically as part of this task graph.
      - name: Test
        run: moon run api:test

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install moon
        uses: moonrepo/setup-toolchain@v0

      - name: Lint
        run: moon run mobile:lint

      - name: Typecheck
        run: moon run mobile:typecheck

      - name: Test
        run: moon run mobile:test

  crypto-review-notice:
    name: crypto-review-notice
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for crypto/auth path changes
        id: changed
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
              | grep -E '^apps/api/src/(crypto|auth)/'; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remind reviewers about crypto-reviewer sign-off
        if: steps.changed.outputs.hit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER="<!-- crypto-review-notice -->"
          if gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq '.[].body' \
              | grep -qF "$MARKER"; then
            echo "Notice already posted, skipping."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$MARKER
          This PR touches \`apps/api/src/crypto/**\` or \`apps/api/src/auth/**\`. Per [AGENTS.md](../blob/main/AGENTS.md), the Reviewer must not merge without \`crypto-reviewer\` sign-off (run the \`pqc-crypto-change\` checklist first)."
