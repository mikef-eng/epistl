name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: epistl
          POSTGRES_PASSWORD: epistl
          POSTGRES_DB: epistl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epistl -d epistl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://epistl:epistl@localhost:5432/epistl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api -> ../../target

      - name: Format
        run: cargo fmt --manifest-path apps/api/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path apps/api/Cargo.toml -- -D warnings

      - name: Run migrations
        run: cargo run --manifest-path apps/api/Cargo.toml --bin migrate

      - name: Test
        run: cargo test --manifest-path apps/api/Cargo.toml

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
