$schema: "https://moonrepo.dev/schemas/project.json"

id: "api"
language: "rust"
layer: "application"

tasks:
  check:
    command: "cargo"
    args: ["fmt", "--", "--check"]
    options:
      cache: false
  lint:
    command: "cargo"
    # `--all-targets` so this also lints `examples/` (e.g.
    # `examples/quic_echo_server.rs`, issue #67) and `tests/`, not just the
    # library/binary targets that plain `cargo clippy` covers by default.
    args: ["clippy", "--all-targets", "--", "-D", "warnings"]
  migrate:
    command: "cargo"
    args: ["run", "--bin", "migrate"]
    options:
      cache: false
  test:
    command: "cargo"
    args: ["test"]
    deps:
      - "migrate"
    options:
      cache: false
  dev:
    command: "cargo"
    args: ["run", "--bin", "api"]
    options:
      persistent: true
      cache: false
      runInCI: false
