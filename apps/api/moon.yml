$schema: "https://moonrepo.dev/schemas/project.json"

id: "api"
language: "rust"
layer: "application"

tasks:
  check:
    command: "cargo"
    args: ["fmt", "--", "--check"]
    options:
      cache: false
  lint:
    command: "cargo"
    # `--all-targets` so this also lints `examples/` (e.g.
    # `examples/quic_echo_server.rs`, issue #67) and `tests/`, not just the
    # library/binary targets that plain `cargo clippy` covers by default.
    args: ["clippy", "--all-targets", "--", "-D", "warnings"]
  migrate:
    command: "cargo"
    args: ["run", "--bin", "migrate"]
    options:
      cache: false
  db-drop:
    command: "cargo"
    # Drops the current worktree's derived Postgres DB and NATS stream.
    # Refuses to run without an active worktree slug (EPISTL_WORKTREE_SLUG
    # or a .claude/worktrees/<name> checkout) so it can never drop the base DB.
    args: ["run", "--bin", "migrate", "--", "--drop"]
    options:
      cache: false
      runInCI: false
  db-prune:
    command: "cargo"
    # Drops every <base_db>_wt_* database (and its NATS stream) whose git
    # worktree no longer exists. Pass --dry-run to list without dropping:
    #   moon run api:db-prune -- --dry-run
    args: ["run", "--bin", "migrate", "--", "--prune"]
    options:
      cache: false
      runInCI: false
  test-build:
    command: "cargo"
    # Builds the test binaries *and* the `migrate` bin in one cargo
    # invocation. `api:migrate` (`cargo run --bin migrate`) resolves a
    # smaller feature set (no dev-dependencies), so building it first
    # recompiles ~60 shared crates a second time; here dev-dep feature
    # unification makes the test build reuse the same artifacts (issue #254).
    args: ["nextest", "run", "--no-run"]
    options:
      cache: false
  test-migrate:
    command: "sh"
    # Runs the `migrate` binary already produced by `test-build` (no extra
    # cargo build). Creates the per-worktree DB + NATS stream on demand.
    args: ["-c", "\"${CARGO_TARGET_DIR:-../../target}/debug/migrate\""]
    deps:
      - "test-build"
    options:
      cache: false
  test:
    command: "cargo"
    # Requires cargo-nextest: `cargo install cargo-nextest --locked` (or a
    # prebuilt binary, https://nexte.st/docs/installation/pre-built-binaries/).
    args: ["nextest", "run", "--config-file", ".config/nextest.toml"]
    deps:
      - "test-migrate"
    options:
      cache: false
  dev:
    command: "cargo"
    args: ["run", "--bin", "api"]
    options:
      persistent: true
      cache: false
      runInCI: false
