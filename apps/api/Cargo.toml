[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util"] }
# `limit` (issue #99, `/api/users/search`'s rate limit) enables
# `tower::limit`. See `apps/api/src/search.rs`'s module docs for why that
# route's actual rate limiter is a small custom `tower`/`axum` middleware
# rather than `tower::limit::RateLimitLayer` directly -- that type's
# backpressure semantics (callers wait out the window instead of getting an
# error) and its non-`Clone` `RateLimit<S>` service don't fit this route's
# "exceeding the limit returns 429" contract or axum's `Router::layer`
# bound.
tower = { version = "0.5", features = ["util", "limit"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sqlx = { version = "0.9", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls",
  "migrate",
  "macros",
  "uuid",
] }
# `better-auth-rs` (pinned in issue #1) is a squatted/placeholder crate name
# on crates.io -- see issue #17. The real, actively-maintained project is
# published as `better-auth`. Pinned to the 1.0.0-alpha.2 pre-release (not
# the 0.10.0 stable line) because only the alpha ships the `seaorm2` feature
# -- stable 0.10.0's only database adapter is `sqlx-postgres` against a
# framework-owned schema, whereas `seaorm2` lets the app own its entities
# and adapt Better Auth to the `users`/`sessions` tables issue #1 already
# migrated (see apps/api/migrations/0004_reconcile_better_auth_schema.sql
# for the additive reconciliation this still required).
better-auth = { version = "1.0.0-alpha.2", features = ["axum", "seaorm2"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15.7"
# The official `nats-io`-maintained Rust client (Apache-2.0; authors listed
# on crates.io are NATS/Synadia engineers) -- supports both core NATS and
# JetStream, though this issue only proves core-NATS connectivity (see
# `apps/api/src/nats.rs`). Pinned to the current crates.io release verified
# at implementation time (`cargo add async-nats --dry-run` from this
# directory); no alternative crate was considered.
async-nats = "0.50.0"
# Real (opt-in, `QUIC_LISTEN_ADDR`-gated) QUIC listener -- `apps/api/src/quic.rs`,
# issue #73. Moved here from `[dev-dependencies]` (where these three crates
# previously sat, only serving the throwaway `examples/quic_echo_server.rs`
# spike from issue #67) since the real listener needs them at runtime in the
# actual binary. Versions unchanged -- still match `packages/quic-relay-client`'s
# so both sides of a real QUIC handshake negotiate the same rustls/ring crypto
# stack.
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"

[dev-dependencies]
# Real WebSocket client for the `/ws` relay's integration tests --
# `tower::ServiceExt::oneshot` can't drive a protocol upgrade, so those
# tests bind a real `TcpListener` and connect over the wire.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "time"] }
tokio-tungstenite = "0.24"
# The row-count-based no-persistence test in tests/ws.rs needs exclusive
# access to the shared test Postgres instance while its before/after
# snapshot is open, so every test in that file runs serialized rather than
# racing sibling tests' signups/contact-adds in the same process.
serial_test = "3"
# Real QUIC client for `apps/api/tests/quic.rs`'s integration tests (issue
# #73) -- a Quinn client connecting to the real listener the same way
# `packages/quic-relay-client`'s spike client does, trusting the listener's
# freshly-generated dev cert the same dev-only way (see
# `docs/decisions/0011-quic-dev-cert-trust-remains-dev-only.md`). `quinn`,
# `rustls`, and `rcgen` themselves are real `[dependencies]` above now (the
# listener needs them at runtime); this dev-dependency is only for the
# test-only client-side helper.
