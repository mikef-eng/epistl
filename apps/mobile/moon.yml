$schema: "https://moonrepo.dev/schemas/project.json"

id: "mobile"
language: "typescript"
layer: "application"
stack: "frontend"

tasks:
  lint:
    command: "npm"
    args: ["run", "lint"]
  typecheck:
    command: "npm"
    args: ["run", "typecheck"]
  test:
    command: "npm"
    args: ["test"]
  start:
    command: "npm"
    args: ["start"]
    options:
      persistent: true
      cache: false
      runInCI: false
