# Local Postgres for API development.
#
# Setup and full run instructions live in README.md ("Running the stack
# locally") and .env.example — this file only wires the container itself.
# `docker compose` automatically reads a .env file in this directory for
# the ${VAR} substitutions below.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-epistl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epistl}
      POSTGRES_DB: ${POSTGRES_DB:-epistl}
    ports:
      - "5432:5432"
    volumes:
      - epistl-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-epistl} -d ${POSTGRES_DB:-epistl}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  epistl-postgres-data:
