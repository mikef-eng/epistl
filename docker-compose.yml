# Local Postgres + NATS + SeaweedFS for API development.
#
# Setup and full run instructions live in README.md ("Running the stack
# locally") and .env.example — this file only wires the containers
# themselves. `docker compose` automatically reads a .env file in this
# directory for the ${VAR} substitutions below.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-epistl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epistl}
      POSTGRES_DB: ${POSTGRES_DB:-epistl}
    ports:
      - "5432:5432"
    volumes:
      - epistl-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-epistl} -d ${POSTGRES_DB:-epistl}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    # `nats:2` (the default, non-suffixed tag) is a scratch/distroless
    # image containing only the `nats-server` binary -- no shell, no
    # `wget` -- so it can't run a `CMD-SHELL` healthcheck against its own
    # monitoring endpoint. `nats:2-alpine` is the same official image
    # published from the same `nats-io/nats-server` source, built on
    # Alpine instead, specifically so tooling like this healthcheck has a
    # shell + `wget` to work with.
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
    volumes:
      - epistl-nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    # Pinned to a specific release (not `latest`), matching this file's
    # existing convention for postgres/nats. MinIO Community Edition was
    # dropped (see docs/decisions/0018-seaweedfs-object-storage-for-avatars.md)
    # in favor of SeaweedFS, an actively-maintained, Apache-2.0,
    # S3-API-compatible object store. `weed mini` is SeaweedFS's own
    # all-in-one single-process mode (master + volume + filer + S3 gateway
    # combined in one container) -- the image's own documented default
    # `CMD`, and the right shape for this repo's single-node local-dev
    # stack (as opposed to SeaweedFS's own example multi-container
    # master/volume/filer/s3 production topology).
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.json"]
    environment:
      # `weed mini` auto-creates this bucket on startup itself -- the
      # later avatar-upload endpoint issue does NOT need any idempotent
      # bucket-creation-on-API-startup logic; that responsibility lives
      # here, in infra.
      S3_BUCKET: ${AVATAR_BUCKET_NAME:-avatars}
    ports:
      # Published to the host (not just `expose:`): presigned URLs are
      # handed to the mobile client, which must reach SeaweedFS directly
      # over a host-reachable address -- not only via the docker-compose
      # internal network the API container uses. See
      # SEAWEEDFS_INTERNAL_ENDPOINT / SEAWEEDFS_PUBLIC_ENDPOINT in
      # .env.example and
      # docs/decisions/0018-seaweedfs-object-storage-for-avatars.md.
      - "8333:8333" # S3 API
      - "23646:23646" # Admin UI (optional local-debugging convenience)
    volumes:
      - epistl-seaweedfs-data:/data
      - ./docker/seaweedfs-s3-config.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  epistl-postgres-data:
  epistl-nats-data:
  epistl-seaweedfs-data:
