# Local Postgres + NATS + MinIO for API development.
#
# Setup and full run instructions live in README.md ("Running the stack
# locally") and .env.example — this file only wires the containers
# themselves. `docker compose` automatically reads a .env file in this
# directory for the ${VAR} substitutions below.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-epistl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epistl}
      POSTGRES_DB: ${POSTGRES_DB:-epistl}
    ports:
      - "5432:5432"
    volumes:
      - epistl-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-epistl} -d ${POSTGRES_DB:-epistl}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    # `nats:2` (the default, non-suffixed tag) is a scratch/distroless
    # image containing only the `nats-server` binary -- no shell, no
    # `wget` -- so it can't run a `CMD-SHELL` healthcheck against its own
    # monitoring endpoint. `nats:2-alpine` is the same official image
    # published from the same `nats-io/nats-server` source, built on
    # Alpine instead, specifically so tooling like this healthcheck has a
    # shell + `wget` to work with.
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
    volumes:
      - epistl-nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Pinned to a specific release (not `latest`), matching this file's
    # existing convention for postgres/nats. MinIO stopped publishing images
    # to Docker Hub in 2024 -- quay.io/minio/minio is the official upstream
    # image now. It ships a shell + curl, so a CMD-SHELL healthcheck against
    # its own liveness endpoint works (unlike the distroless `nats:2` tag
    # documented above).
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-epistl}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-epistl-minio}
    ports:
      # Published to the host (not just `expose:`): presigned URLs are
      # handed to the mobile client, which must reach MinIO directly over a
      # host-reachable address -- not only via the docker-compose internal
      # network the API container uses. See MINIO_INTERNAL_ENDPOINT /
      # MINIO_PUBLIC_ENDPOINT in .env.example and
      # docs/decisions/0017-minio-object-storage-for-avatars.md.
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - epistl-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  epistl-postgres-data:
  epistl-nats-data:
  epistl-minio-data:
