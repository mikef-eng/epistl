$schema: "https://moonrepo.dev/schemas/project.json"

id: "dev-setup"
language: "rust"
layer: "tool"

tasks:
  check:
    command: "cargo"
    args: ["fmt", "--", "--check"]
    options:
      cache: false
  lint:
    command: "cargo"
    args: ["clippy", "--all-targets", "--", "-D", "warnings"]
  test:
    command: "cargo"
    args: ["test"]
    options:
      cache: false
  # Detect-only by default so moon/CI never mutate the host. Pass extra
  # args after `--` to exercise interactive/install paths, e.g.
  # `moon run dev-setup:run -- --yes --start`.
  run:
    command: "cargo"
    args: ["run", "--", "--check"]
    options:
      cache: false
      runInCI: false
  bootstrap-lint:
    command: "shellcheck"
    args: ["bootstrap.sh"]
    options:
      cache: false
