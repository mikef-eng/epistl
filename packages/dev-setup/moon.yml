$schema: "https://moonrepo.dev/schemas/project.json"

id: "dev-setup"
language: "rust"
layer: "tool"

tasks:
  check:
    command: "cargo"
    args: ["fmt", "--", "--check"]
    options:
      cache: false
  lint:
    command: "cargo"
    args: ["clippy", "--all-targets", "--", "-D", "warnings"]
  test:
    command: "cargo"
    args: ["test"]
    options:
      cache: false
  # Invokes the CLI directly -- detect-only by default (no mutating
  # docker/moon/brew/apt actions), so this is safe to run repeatedly and
  # isn't cached, same reasoning as `check`/`test` above. The opt-in
  # exceptions are `--install` (macOS Homebrew / apt-based Linux
  # auto-install, issues #204/#205) and `--start` (docker-compose-up +
  # api:migrate, issue #206), neither of which this task passes; pass
  # e.g. `-- --install` or `-- --start` explicitly to exercise those
  # paths.
  run:
    command: "cargo"
    args: ["run"]
    options:
      cache: false
      runInCI: false
