$schema: "https://moonrepo.dev/schemas/project.json"

id: "dev-setup"
language: "rust"
layer: "tool"

tasks:
  check:
    command: "cargo"
    args: ["fmt", "--", "--check"]
    options:
      cache: false
  lint:
    command: "cargo"
    args: ["clippy", "--all-targets", "--", "-D", "warnings"]
  test:
    command: "cargo"
    args: ["test"]
    options:
      cache: false
  # Invokes the CLI directly -- detect-only (no mutating docker/moon
  # actions in this issue), so this is safe to run repeatedly and isn't
  # cached, same reasoning as `check`/`test` above.
  run:
    command: "cargo"
    args: ["run"]
    options:
      cache: false
      runInCI: false
