$schema: "https://moonrepo.dev/schemas/project.json"

id: "dev-setup"
language: "rust"
layer: "tool"

tasks:
  check:
    command: "cargo"
    args: ["fmt", "--", "--check"]
    options:
      cache: false
  lint:
    command: "cargo"
    args: ["clippy", "--all-targets", "--", "-D", "warnings"]
  test:
    command: "cargo"
    args: ["test"]
    options:
      cache: false
  # Invokes the CLI directly. Detect-only by default -- safe to run
  # repeatedly and not cached, same reasoning as `check`/`test` above.
  # Pass `-- --start` (e.g. `moon run dev-setup:run -- --start`) to opt
  # into the mutating docker-compose-up + api:migrate flow (issue #206);
  # without it, this never shells out to docker or moon beyond the
  # detect-only checks in `checks.rs`.
  run:
    command: "cargo"
    args: ["run"]
    options:
      cache: false
      runInCI: false
