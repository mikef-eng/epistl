[package]
name = "dev-setup"
version = "0.1.0"
edition = "2021"
publish = false
description = """
Local dev-environment bootstrapper for Epistl (issues #222–#224). Prefer
`bash packages/dev-setup/bootstrap.sh` on a fresh machine: Stage 1 installs
base build packages, rustup, and sccache, then hands off to this Rust CLI
(Stage 2) which interactively installs Node (fnm), moon, Docker, env files,
optional Android/iOS toolchains, and can bring up docker compose + migrations.
Interactive install is the default; `--check` is detect-only. See README.md.
"""

# No external crate dependencies: OS detection, shelling out, and flag
# parsing use std only, behind injectable CommandExecutor / Environment
# traits so unit tests never touch the real PATH.

[lib]
name = "dev_setup"
path = "src/lib.rs"

[[bin]]
name = "dev-setup"
path = "src/main.rs"
