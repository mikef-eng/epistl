[package]
name = "dev-setup"
version = "0.1.0"
edition = "2021"
publish = false
description = """
Local dev-environment checker for Epistl (issue #203): detects the host
OS (macOS/Linux only), auto-copies `.env.example` to `.env` if missing,
and reports Present/Absent for the core tools README's "Running the
stack locally" section requires (rustup, cargo/rustc, node, moon,
docker, sccache). Detect-only in this issue -- no installs, no mutating
docker/moon actions; see the issue for the follow-up, OS-specific
install-flow work this scaffolds toward.
"""

# No external dependencies: OS detection uses `std::env::consts::OS`,
# tool detection shells out via `std::process::Command` behind this
# crate's own `CommandExecutor` trait (see src/checks.rs), and this
# issue's acceptance criteria don't call for any CLI flags/arguments, so
# there's nothing here an argument-parsing crate would buy.

[lib]
name = "dev_setup"
path = "src/lib.rs"

[[bin]]
name = "dev-setup"
path = "src/main.rs"
