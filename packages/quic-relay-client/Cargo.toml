[package]
name = "quic-relay-client"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = """
Rust client for `apps/api`'s real QUIC listener (issue #73), exposed to
React Native via `uniffi-bindgen-react-native`: a one-shot `quic_ping`
spike function (issue #67) plus a persistent `QuicConnection` API (issue
#75) for the lifetime of a chat session. Not product code in the sense of
having a UI of its own -- see
docs/superpowers/specs/2026-09-13-quic-quinn-transport-design.md.
"""

[lib]
# "lib" -- normal Rust usage (this crate's own tests, `cargo test`).
# "cdylib" -- Android's JNI loads this as a shared library.
# "staticlib" -- iOS links this into an xcframework as a static library.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
uniffi = "=0.31"
# Quinn's default features already include `runtime-tokio` and
# `rustls-ring`, which is what this crate's own TLS setup (below) matches.
quinn = "0.11"
# `default-features = false` because rustls's default crypto provider is
# `aws_lc_rs`; this crate instead matches Quinn's default `ring` provider
# (see `crypto::install_default_provider` in src/lib.rs) so there is only
# one crypto backend in the dependency tree, not two.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# "io-util" -- `QuicConnection`'s persistent control-stream reader wraps the
# recv side in a `BufReader` and reads newline-delimited frames via
# `AsyncBufReadExt::read_line`, mirroring `apps/api/src/quic.rs`'s framing.
# "macros" -- `QuicConnection::connect` races the auth-frame write against a
# grace-period timeout via `tokio::select!`.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }
thiserror = "2"
# `QuicConnection::connect` encodes the `{"type":"auth","token":...}` first
# frame as real JSON (not hand-rolled string formatting) so token values are
# escaped correctly -- matching `apps/api/src/quic.rs`'s use of `serde_json`
# on the other side of the same wire protocol.
serde_json = "1"

[dev-dependencies]
# The crate's tests spin up throwaway in-process Quinn servers (mirroring
# `apps/api/examples/quic_echo_server.rs` for `quic_ping`, and
# `apps/api/src/quic.rs`'s auth/framing protocol for `QuicConnection`) to
# exercise this crate's client code end to end; the published client code
# never needs a certificate generator.
rcgen = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util"] }
